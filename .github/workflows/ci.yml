name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore CxCell.sln
      - name: Build
        run: dotnet build CxCell.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/CxCell.Tests/CxCell.Tests.csproj -c Release --no-build --verbosity normal
