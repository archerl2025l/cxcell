name: ci-self-hosted

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the self-contained Windows build as a workflow artifact"
        required: false
        type: boolean
        default: true

concurrency:
  group: cxcell-self-hosted
  cancel-in-progress: false

jobs:
  build-test:
    name: self-hosted build-test
    runs-on: [self-hosted, windows, x64, cxcell-local]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Runner diagnostics
        shell: pwsh
        run: |
          Write-Host "Runner name: $env:RUNNER_NAME"
          Write-Host "Runner OS:   $env:RUNNER_OS"
          Write-Host "Runner arch: $env:RUNNER_ARCH"
          Write-Host "Workspace:   $env:GITHUB_WORKSPACE"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CxCell.sln

      - name: Build
        run: dotnet build CxCell.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/CxCell.Tests/CxCell.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish self-contained Windows EXE
        run: dotnet publish .\src\CxCell\CxCell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\self-hosted-win-x64

      - name: Upload Windows artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: cxcell-self-hosted-win-x64
          path: artifacts/self-hosted-win-x64/
